[project]
name = "nanacoin-load"
version = "0.1.0"
description = "Locust journeys, workload isolation, and board-health reports for NanaCoin"
requires-python = ">=3.14,<3.15"
dependencies = ["locust>=2.46.6,<3", "requests>=2.32", "pyserial>=3.5"]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.15"]

[project.scripts]
ncload = "nanacoin_load.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 110
