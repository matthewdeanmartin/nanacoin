site_name: "NanaCoin"
site_author: "Matthew Dean Martin <matthewdeanmartin@gmail.com>"
site_description: "A household currency for a microcontroller - ledger, marketplace and firmware"

repo_url: "https://github.com/matthewdeanmartin/nanacoin"

docs_dir: docs

theme:
  name: readthedocs
  features:
    - navigation.footer

edit_uri: edit/main/docs/

markdown_extensions:
  - admonition
  - attr_list
  - codehilite
  - toc:
      permalink: true

nav:
  - "Home": "index.md"
  - "Basic Setup":
      - "Overview": "basic_setup/index.md"
      - "The Board": "basic_setup/the_board.md"
      - "Toolchain Setup": "basic_setup/toolchain.md"
      - "The Project": "basic_setup/the_project.md"
      - "Build, Flash, Monitor": "basic_setup/build_flash_monitor.md"
      - "Troubleshooting": "basic_setup/troubleshooting.md"
  - "Rust and NanaCoin":
      - "Overview": "rust/index.md"
      - "Build and Code Map": "rust/workflow.md"
      - "Memory and Ownership": "rust/memory.md"
      - "Domain, HTTP and Concurrency": "rust/architecture.md"
      - "NVS Keys and Recovery": "rust/storage.md"
      - "Diagnostics": "rust/diagnostics.md"
      - "Mastodon Integration": "rust/mastodon.md"
  - "TinyGo and NanaCoin":
      - "Overview": "tinygo/index.md"
      - "How It Works": "tinygo/how_it_works.md"
      - "Setup": "tinygo/setup.md"
      - "The Workflow": "tinygo/workflow.md"
      - "Memory": "tinygo/memory.md"
      - "The Web Framework": "tinygo/web_framework.md"
      - "NanaCoin's Domain": "tinygo/nanacoin.md"
      - "Storage and Retries": "tinygo/storage.md"
      - "Concurrency and Cores": "tinygo/concurrency.md"
      - "Diagnostics and Load Tests": "tinygo/diagnostics.md"

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

plugins:
  - search
