# Publish the NanaCoin demo to GitHub Pages.
#
# The demo is the Angular client with an in-memory ledger behind it: no
# server, no board, nothing to deploy but static files. It lives at a subpath
# so that the mkdocs site can have the root if it is ever published here too.
---
name: Deploy NanaCoin demo
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish (branch, tag, or commit SHA)
        required: true
        default: main
        type: string
  push:
    branches: [main]
    paths:
      - 'nanacoin_go/angular/**'
      - '.github/workflows/nanacoin-pages.yml'

# One deployment at a time. A second run while the first is publishing would
# race it, and the loser silently wins.
concurrency:
  group: nanacoin-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and deploy the demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      # Pages serves this repository at /nanacoin/. The demo takes the root of
      # that, since this repo is the demo's own project.
      BASE_HREF: /nanacoin/
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nanacoin_go/angular/package-lock.json

      - name: Install dependencies
        working-directory: nanacoin_go/angular
        run: npm ci

      # The demo has to pass its own tests before it is shown to anyone: the
      # in-memory ledger enforces the same economic rules the Go server does,
      # and a demo that gets those wrong is worse than no demo.
      - name: Test
        working-directory: nanacoin_go/angular
        run: npm test -- --watch=false

      - name: Build the demo
        working-directory: nanacoin_go/angular
        run: npx ng build --configuration demo --base-href "$BASE_HREF"

      - name: Test the actual static site in a browser
        working-directory: nanacoin_go/angular
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
          python scripts/showcase-check.py

      # Hash routing means every route is /#/market, so a 404 fallback is not
      # strictly needed - but a mistyped path should land on the app rather
      # than on GitHub's own 404 page.
      - name: Add SPA fallback
        run: cp nanacoin_go/angular/dist/nanacoin-web/browser/index.html
             nanacoin_go/angular/dist/nanacoin-web/browser/404.html

      # Jekyll would otherwise ignore files beginning with an underscore.
      - name: Disable Jekyll
        run: touch nanacoin_go/angular/dist/nanacoin-web/browser/.nojekyll

      - name: Verify the built demo
        run: |
          cd nanacoin_go/angular/dist/nanacoin-web/browser
          test -f index.html
          test -f 404.html
          grep --fixed-strings '<base href="/nanacoin/">' index.html
          # The demo flag must actually have been swapped in: without it the
          # site would deploy and then try to reach a board on someone's LAN.
          #
          # The seeded household is what proves it, because that string exists
          # only in the demo build. The login screen's wording survives
          # tree-shaking in both builds - it lives in a template branch that is
          # never taken - so grepping for that would pass either way.
          grep --quiet --recursive 'Monthly household float' . \
            || { echo 'not a demo build: the in-memory ledger is missing'; exit 1; }

      - name: Assemble the Pages site
        run: |
          mkdir -p .pages-site
          cp -r nanacoin_go/angular/dist/nanacoin-web/browser/. .pages-site/
          touch .pages-site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: .pages-site

      - name: Deploy Pages
        id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
