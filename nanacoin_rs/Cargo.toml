[package]
name = "nanacoin_rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
default-run = "nanacoin"
build = "build.rs"

[lib]
name = "nanacoin"

[[bin]]
name = "nanacoin"
path = "src/bin/desktop.rs"
required-features = ["desktop"]

[[bin]]
name = "nanacoin-esp32"
path = "src/bin/esp32.rs"
required-features = ["esp32"]

[features]
default = ["desktop"]
desktop = ["dep:fs2"]
# Optional banking kernel: Windows DLL or explicitly built ESP-IDF static module.
cobol-core = ["dep:libloading"]
# Launcher-only clock input for deterministic HTTP conformance fixtures.
conformance-clock = ["desktop"]
# Explicit offline emulator time initialization; normal board builds omit it.
emulator-clock = ["esp32"]
esp32 = ["miniframework/esp32", "dep:esp-idf-svc", "dep:embuild", "dep:log", "bundled-web"]
bundled-web = []
# Smaller-board bank; see src/board.rs. Never enabled for the S3 firmware.
board-s2 = []
board-p4 = []
# Also serve HTTP/2 (ALPN over HTTPS); HTTP and HTTPS are always built.
http2 = ["miniframework/http2"]

[dependencies]
heapless = { version = "0.8", features = ["serde"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde-json-core = "0.6"
postcard = { version = "1", default-features = false }
sha2 = { version = "0.10", default-features = false }
subtle = { version = "2.6", default-features = false }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
base64 = { version = "0.22", default-features = false }
getrandom = "0.2"
crc32fast = "1.4"
hmac = "0.12"
# The HTTP/HTTPS server, static files, board runner and deploy tooling.
# Without gzip: NanaCoin's API replies are small and its bundle is
# compressed at build time, so the deflate code would only cost flash.
miniframework = { path = "../../microcontroller/miniframework/crates/miniframework", default-features = false, features = ["tls"] }
fs2 = { version = "0.4", optional = true }
log = { version = "0.4", optional = true }

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-svc = { version = "=0.52.1", optional = true, features = ["experimental"] }

[target.'cfg(target_os = "windows")'.dependencies]
libloading = { version = "0.8.9", optional = true }

[build-dependencies]
embuild = { version = "0.33", optional = true, features = ["espidf"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.esp-idf-sys]
esp_idf_version = "v5.5.3"
esp_idf_sdkconfig_defaults = ["sdkconfig.defaults"]

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.8.2" }
bindings_header = "src/mdns_bindings.h"

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components/p4-network"]
bindings_header = "src/p4_bindings.h"
